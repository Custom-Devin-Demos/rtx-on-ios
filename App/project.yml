name: RTXOn
options:
  bundleIdPrefix: com.devindemos.nvidia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
packages:
  RTXOnCore:
    path: ../Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  RTXOn:
    type: application
    platform: iOS
    sources:
      - path: RTXOn
      - path: Shared
    dependencies:
      - package: RTXOnCore
      - target: RTXOnWidget
        embed: true
    entitlements:
      path: RTXOn/RTXOn.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.devindemos.nvidia.rtxon
    info:
      path: RTXOn/Info.plist
      properties:
        CFBundleDisplayName: RTX ON
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devindemos.nvidia.rtxon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  RTXOnWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: RTXOnWidget
      - path: Shared
    dependencies:
      - package: RTXOnCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: RTXOnWidget/RTXOnWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.devindemos.nvidia.rtxon
    info:
      path: RTXOnWidget/Info.plist
      properties:
        CFBundleDisplayName: rtx-smi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devindemos.nvidia.rtxon.widget
        SKIP_INSTALL: YES
  RTXOnTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RTXOnTests
    dependencies:
      - target: RTXOn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devindemos.nvidia.rtxon.tests
schemes:
  RTXOn:
    build:
      targets:
        RTXOn: all
        RTXOnWidget: all
        RTXOnTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - RTXOnTests
    archive:
      config: Release
